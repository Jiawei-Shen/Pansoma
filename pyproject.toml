[build-system]
requires = ["setuptools>=68", "wheel", "pybind11>=2.11,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "pangenome-ml-data-generation"
version = "0.1.0"
description = "Generate variant-centered pileup tensors from pangenome graph alignments."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  { name = "Jiawei Shen" }
]
dependencies = [
  "numpy",
  "matplotlib",
  "pillow>=10",
  "pysam",
  "pybind11",
  "torch>=2.1",
  "torchvision>=0.16",
  "timm>=1.0,<2",
  "tqdm>=4.66",
]

[tool.setuptools.packages.find]
where = ["src"]
